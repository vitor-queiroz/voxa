spring.application.name=backend

# Porta: no Render vem da variável PORT; na sua máquina continua 8080
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
# No Render, defina SHOW_SQL=false para não encher o log com cada consulta
spring.jpa.show-sql=${SHOW_SQL:true}

# Endereços que podem chamar a API pelo navegador (CORS), separados por vírgula.
# No Render, defina CORS_ORIGINS com o endereço do frontend publicado.
voxa.cors.origins=${CORS_ORIGINS:http://localhost:4200}

# Percentual de comissão usado quando o funcionário não tem percentual_comissao próprio
voxa.comissao.percentual-padrao=3
