# Configuração dos testes: banco H2 em memória no modo MySQL (não usa o banco real)
spring.datasource.url=jdbc:h2:mem:voxa;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

voxa.comissao.percentual-padrao=3
