<ol class="etapas">
  @for (etapa of etapas; track etapa; let i = $index) {
    <li [class.atual]="i + 1 === atual()" [class.feita]="i + 1 < atual()" [attr.aria-current]="i + 1 === atual() ? 'step' : null">
      <span class="numero">{{ i + 1 < atual() ? '✓' : i + 1 }}</span>
      {{ etapa }}
    </li>
  }
</ol>
