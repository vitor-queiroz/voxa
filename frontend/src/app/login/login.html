<div class="login-container">
  <div class="login-box">

    <div class="logo">
      VOXA
    </div>

    <form>
      <div class="form-group">
        <label for="usuario">Acesso</label>
        <input
          type="text"
          id="usuario"
          name="usuario"
          placeholder="Digite seu usuário"
        />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="Digite sua senha"
        />
      </div>

      <button type="submit">
        Acessar
      </button>
    </form>

  </div>
</div>
