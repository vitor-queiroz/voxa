<div class="login-container">
  <div class="login-card">
    <div class="logo-container">
      <h1 class="logo-title">VOXA</h1>
      <span class="logo-subtitle">MANAGER</span>
    </div>

    <form class="login-form" #formRef="ngForm" (ngSubmit)="acessar(formRef)">
      <div class="form-group">
        <label for="acesso">Acesso</label>
        <input
          type="text"
          id="acesso"
          name="usuario"
          [(ngModel)]="usuario"
          placeholder="Digite seu usuário"
          required
          autocomplete="off"
        />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          name="senha"
          [(ngModel)]="senha"
          placeholder="Digite sua senha"
          required
        />
      </div>

      <button type="submit" class="btn-acessar">Acessar</button>
    </form>
  </div>
</div>
